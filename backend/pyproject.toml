[project]
name = "pappy"
version = "0.1.0"
description = "Pappy household payroll manager — API backend"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.77",
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]>=1.43.77",
    "httpx>=0.27",
    "moto>=5.2.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
    "uvicorn>=0.32",
    "watchfiles>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pappy"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
