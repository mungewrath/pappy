# Local dev environment: DynamoDB Local + backend (uvicorn --reload) +
# frontend (vite).
#
# Up:   docker compose up -d          (add --build after dependency changes)
# Logs: docker compose logs -f [backend|frontend|dynamodb]
# Stop: docker compose down           (-v also wipes the local table data)
name: pappy

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: pappy-dynamodb-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8500:8000"

  db-init:
    # One-shot: waits for dynamodb, then creates the `pappy` single table and
    # seeds the versioned rate tables from ./rates (idempotent).
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pappy-db-init
    environment:
      &backend-env
      PAPPY_DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-west-2
      # Dev-only: data endpoints derive employerId from the JWT `sub` claim;
      # without Cognito configured locally this pins requests to one principal.
      # Never set in deployed environments (§7.1).
      PAPPY_DEV_FALLBACK_SUB: local-dev-user
      # Reminder email routing (§6.6). Locally the mailer defaults to the log
      # transport — emails print to `docker compose logs backend` instead of
      # being sent; Terraform sets PAPPY_MAILER=ses in deployments.
      PAPPY_REMINDER_FROM_EMAIL: matthew.unrath@gmail.com
      PAPPY_REMINDER_TO_EMAIL: mungewrath@gmail.com
      PAPPY_DOCUMENTS_DIR: /tmp/pappy-documents
    volumes:
      # Rate tables live at the repo root, outside the backend image.
      - ./rates:/rates:ro
    depends_on:
      - dynamodb
    command:
      - sh
      - -ec
      - |
        i=0
        until uv run python -c 'from pappy.repo.table import create_table_if_not_exists as c; c()' 2>/tmp/db-init.err; do
          i=$$((i+1))
          if [ "$$i" -ge 60 ]; then
            cat /tmp/db-init.err
            echo "db-init: dynamodb-local unreachable" >&2
            exit 1
          fi
          sleep 1
        done
        PAPPY_RATES_DIR=/rates uv run python -m pappy.repo.seed
        echo "db-init: pappy table + rate tables ready"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pappy-backend
    restart: unless-stopped
    init: true
    environment: *backend-env
    depends_on:
      dynamodb:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    command:
      - uv
      - run
      - uvicorn
      - pappy.api.app:app
      - --reload
      # Watch only the source package: keeps the reloader's event set small so
      # file events don't churn across the Docker VM boundary when idle.
      - --reload-dir=pappy
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind-mount the source for hot reload (--reload). The venv lives in
      # /opt/venv (see Dockerfile.dev) so it is not shadowed by this mount.
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pappy-frontend
    restart: unless-stopped
    init: true
    depends_on:
      - backend
    command:
      - npm
      - run
      - dev
      - --
      - --host=0.0.0.0
      - --port=5173
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      # Source bind mount for HMR; node_modules comes from the image via a
      # named volume so host/container native binaries never clash. The
      # entrypoint runs npm ci automatically if package.json/lock change.
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  frontend-node-modules:

# By default DynamoDB Local runs in-memory — table data
# is lost on `docker compose down`. To persist it instead:
#   dynamodb:
#     command: -jar DynamoDBLocal.jar -dbPath /home/dynamodblocal/data/
#     volumes:
#       - dynamodb-data:/home/dynamodblocal/data/
#   ...and move `dynamodb-data:` into the `volumes:` block above.
